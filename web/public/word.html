<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Word Detail</title>
<style>
body{font-family:sans-serif;font-size:20px;line-height:1.9;padding:20px;max-width:900px;margin:0 auto;background:#f8f9fa}
h1{font-size:28px;margin-bottom:4px}.pos{color:#1a73e8;font-size:16px}.phonetic{color:#666;font-size:16px}
.meaning{font-size:18px;margin-top:4px;color:#555;margin-bottom:16px}
.section{margin-bottom:20px}
.section h3{font-size:18px;font-weight:700;border-left:4px solid #1a73e8;padding-left:10px;margin-bottom:10px}
.en{color:#1a1a1a;margin-bottom:4px}.cn{color:#888;font-size:16px}
.colloc-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.colloc-tag{background:#e8f0fe;padding:2px 10px;border-radius:12px;font-size:14px;white-space:nowrap}
.example-item{margin-bottom:8px;padding:8px 12px;background:#f8f9fa;border-radius:6px;border-left:3px solid #ddd}
.example-item .ex-en{font-size:16px}
.example-item .ex-cn{font-size:15px;color:#888;margin-top:2px}
.back{display:inline-block;margin-bottom:16px;padding:6px 14px;background:#1a73e8;color:#fff;border-radius:6px;text-decoration:none;font-size:14px}
.loading{text-align:center;padding:40px;color:#999}
.src{display:inline-block;font-size:11px;color:#fff;padding:1px 6px;border-radius:8px;margin-right:4px}
.s-CET46{background:#1a73e8}.s-KAOYAN{background:#d93025}.s-TOEFL{background:#e37400}.s-ACADEMIC{background:#7b1fa2}.s-COMMON{background:#5f6368}.s-PREP{background:#0d652d}
</style></head><body>
<a class="back" href="index.html">← Back to List</a>
<div id="out"><div class="loading">Loading word data...</div></div>
<script src="data.js"></script>
<script>
var ID = parseInt(new URL(window.location.href).searchParams.get('id'));
if(!ID){document.getElementById('out').innerHTML='<div class="loading">No word ID</div>';}
else showWord(ID);

function toggle(el){
  var n=el.nextElementSibling;
  if(n&&(n.className.indexOf('cn')>=0||n.className.indexOf('ex-cn')>=0))
    n.style.display=n.style.display==='none'?'block':'none';
}

function stripSource(t){
  var p=['CET-4/6: ','CET-6: ','CET-4: ','考研: ','TOEFL/IELTS: ','TOEFL: ','IELTS: ','Academic: ','Common: ','介词搭配: '];
  for(var i=0;i<p.length;i++){if(t.indexOf(p[i])===0)return t.substring(p[i].length);}
  return t;
}

function showWord(id){
  var D = WORD_DATA;
  var w = D.words.find(function(x){return x.id===id;});
  if(!w){document.getElementById('out').innerHTML='<div class="loading">Word #'+id+' not found</div>';return;}
  
  var sn={0:'New',1:'Learning',2:'Reviewing',3:'Mastered'};
  var c=D.collocs[id]||[], p=D.preps[id]||[], de=D.defs[id]||[];
  var n=D.notes[id]||[], e=D.examples[id]||[], t=D.tags[id]||[];
  
  // Header
  var h='<h1>'+w.word+' <span class="pos">'+w.pos+'</span>'+(w.phonetic?'<span class="phonetic">/'+w.phonetic+'/</span>':'')+'</h1>'+
    '<div class="meaning">'+(w.meaning||'')+'</div>';
  
  // Etymology - EN shown, CN collapsed
  if(w.etym){
    h+='<div class="section"><h3>📜 Etymology</h3><div class="en">'+w.etym+'</div>';
    if(w.etym_cn) h+='<div class="cn" style="margin-top:6px">'+w.etym_cn+'</div>';
    h+='</div>';
  }
  
  // Definitions - EN shown, CN collapsed
  if(de.length){
    h+='<div class="section"><h3>📖 Definitions</h3>';
    for(var i=0;i<de.length;i++){
      h+='<div class="en">'+de[i].en+'</div>';
      if(de[i].cn) h+='<div class="cn" style="margin-top:6px">'+de[i].cn+'</div>';
    }
    h+='</div>';
  }
  
  // Usage Notes - EN shown, CN collapsed
  if(n.length){
    h+='<div class="section"><h3>💡 Usage Notes</h3>';
    for(var i=0;i<n.length;i++){
      h+='<div class="en">— '+n[i].en+'</div>';
      if(n[i].cn) h+='<div class="cn" style="margin-top:6px">'+n[i].cn+'</div>';
    }
    h+='</div>';
  }
  
  // Collocations - EN shown, CN collapsed
  if(c.length){
    h+='<div class="section"><h3>🔗 Collocations</h3>';
    for(var i=0;i<c.length;i++){
      h+='<div class="en" style="margin-bottom:2px;cursor:pointer" onclick="toggle(this)">'+c[i].en+'</div>';
      if(c[i].cn) h+='<div class="cn" style="display:none;margin-top:6px;margin-bottom:8px">'+c[i].cn+'</div>';
    }
    h+='</div>';
  }
  
  // Prepositions - EN shown, CN collapsed
  if(p.length){
    h+='<div class="section"><h3>🧩 Preposition Patterns</h3>';
    for(var i=0;i<p.length;i++){
      h+='<div class="en" style="margin-bottom:2px;cursor:pointer" onclick="toggle(this)">'+p[i].pat+(p[i].prep?' <small style="color:#999">('+p[i].prep+')</small>':'')+'</div>';
      if(p[i].cn) h+='<div class="cn" style="display:none;margin-top:6px;margin-bottom:8px">'+p[i].cn+'</div>';
    }
    h+='</div>';
  }
  
  // Tags
  if(t.length) h+='<div class="section"><h3>🏷️ Tags</h3>'+t.join(', ')+'</div>';
  
  // Examples - EN shown, CN collapsed
  if(e.length){
    var ps=[],ss=[];
    for(var i=0;i<e.length;i++){if(e[i].src==='PREP')ps.push(e[i]);else ss.push(e[i]);}
    h+='<div class="section"><h3>📝 Examples</h3>';
    if(ss.length){
      h+='<details open><summary>Standard Examples ('+ss.length+')</summary>';
      for(var i=0;i<ss.length;i++){
        h+='<div class="example-item"><span class="src s-'+ss[i].src+'">'+ss[i].src+'</span> <span class="ex-en" style="cursor:pointer" onclick="toggle(this)">'+stripSource(ss[i].en)+'</span>'+
          (ss[i].cn?'<div class="ex-cn" style="display:none;margin-top:6px">'+ss[i].cn+'</div>':'')+'</div>';
      }
      h+='</details>';
    }
    if(ps.length){
      h+='<details open><summary>Preposition Examples ('+ps.length+')</summary>';
      for(var i=0;i<ps.length;i++){
        h+='<div class="example-item"><span class="src s-PREP">PREP</span> <span class="ex-en" style="cursor:pointer" onclick="toggle(this)">'+stripSource(ps[i].en)+'</span>'+
          (ps[i].cn?'<div class="ex-cn" style="display:none;margin-top:6px">'+ps[i].cn+'</div>':'')+'</div>';
      }
      h+='</details>';
    }
    h+='</div>';
  }
  
  document.getElementById('out').innerHTML = h;
}
</script>
</body></html>
